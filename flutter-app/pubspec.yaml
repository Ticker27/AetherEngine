name: flutter_app
description: AetherEngine Dart application, embedded as an Android Flutter module.
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4

flutter:
  module:
    androidX: true
    androidPackage: com.aether.flutter_app
  uses-material-design: true
  assets:
    - assets/
