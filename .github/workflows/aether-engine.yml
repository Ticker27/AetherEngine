name: Aether Engine Phase 1 (Build, Test, Release)

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aether-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null

      - name: Make Gradle executable
        run: chmod +x aether-engine/gradlew

      - name: Assemble debug APK
        shell: bash
        working-directory: aether-engine
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/aether-assemble.log || {
            tail -n 60 /tmp/aether-assemble.log
            diagnostics="$(grep -iE '(^e:|error|failed|conflict|manifest merger|aapt|uses-sdk|suggestion|what went wrong|execution failed)' /tmp/aether-assemble.log | tail -n 40 || true)"
            if [[ -z "$diagnostics" ]]; then diagnostics="$(tail -n 20 /tmp/aether-assemble.log)"; fi
            summary="$(printf '%s' "$diagnostics" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=aether-engine assembleDebug failed::$summary"
            exit 1
          }

      - name: Assemble androidTest sources
        shell: bash
        working-directory: aether-engine
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace --console=plain

      - name: Verify APK contents (arm64-v8a only, libaether.so present)
        shell: bash
        run: |
          set -euo pipefail
          APK=aether-engine/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" > /tmp/apk-list.txt
          if ! grep -q 'lib/arm64-v8a/libaether.so' /tmp/apk-list.txt; then
            echo "::error title=APK missing lib/arm64-v8a/libaether.so::"
            exit 1
          fi
          if grep -E 'lib/(armeabi-v7a|armeabi|x86|x86_64|mips)/' /tmp/apk-list.txt; then
            echo "::error title=Unexpected ABI directory in APK::"
            exit 1
          fi
          echo "OK: libaether.so present, arm64-v8a only"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-engine-debug-${{ github.sha }}
          path: aether-engine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Phase 1 contract tests (JNI, manifest, locks, forbidden tokens)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os, re, sys, xml.etree.ElementTree as ET
          R = "aether-engine"
          fail = []
          def chk(c, m):
              print(("PASS  " if c else "FAIL  ") + m)
              if not c: fail.append(m)

          # 1) spec §2 tree
          spec = {"settings.gradle.kts","build.gradle.kts","gradle.properties","app/build.gradle.kts",
                  "app/src/main/AndroidManifest.xml",
                  "app/src/main/kotlin/com/aether/App.kt","app/src/main/kotlin/com/aether/Entry.kt"}
          for f in ["Native","DaemonService","ProxyActivity","TransparentProxyActivity","ProxyPendingActivity",
                    "ProxyService","ProxyJobService","ProxyContentProvider","SystemCallProvider",
                    "ProxyVpnService","ProxyBroadcastReceiver","FileProvider"]:
              spec.add(f"app/src/main/kotlin/com/aether/helper/{f}.kt")
          for f in ["CMakeLists.txt","jni_bridge.cpp","runtime_init.cpp"]:
              spec.add(f"app/src/main/cpp/{f}")
          spec.add("app/src/androidTest/kotlin/com/aether/NativeContractTest.kt")
          actual = {os.path.relpath(os.path.join(dp, f), R) for dp, _, fs in os.walk(R) for f in fs}
          chk(spec <= actual, f"tree: all {len(spec)} spec files present (missing {sorted(spec - actual)})")

          # 2) Kotlin <-> kMethods JNI contract (11 entries, descriptors derived from Kotlin)
          nk = open(f"{R}/app/src/main/kotlin/com/aether/helper/Native.kt").read()
          pm = {"Any?":"Ljava/lang/Object;","String?":"Ljava/lang/String;","Int":"I","Boolean":"Z",
                "ByteArray?":"[B","ByteArray":"[B","android.content.Context?":"Landroid/content/Context;",
                "java.lang.reflect.Method?":"Ljava/lang/reflect/Method;"}
          rm = {"None":"V","Boolean":"Z","ByteArray":"[B","String?":"Ljava/lang/String;"}
          kt = []
          for m in re.finditer(r"external fun (\w+)\(([^)]*)\)(?:\s*:\s*([\w.?]+))?", nk):
              ps = [p.split(": ", 1)[1] for p in m.group(2).split(", ")] if m.group(2) else []
              kt.append((m.group(1), "(" + "".join(pm[p] for p in ps) + ")" + rm[m.group(3) or "None"]))
          cpp = open(f"{R}/app/src/main/cpp/jni_bridge.cpp").read()
          jm = re.findall(r'\(char\*\)"(\w+)",\s*\(char\*\)"([^"]+)"', cpp)
          chk(len(kt) == 11 and kt == jm, f"JNI contract: 11 entries, order+descriptors match (kt={len(kt)}, cpp={len(jm)})")
          chk("RegisterNatives(clazz, kMethods, 11)" in cpp and "idx < 11" in cpp, "RegisterNatives count literal 11")
          chk('FindClass("com/aether/helper/Native")' in cpp, "FindClass path matches Native package")

          # 3) manifest (§6 + acceptance step 6 URI)
          raw = open(f"{R}/app/src/main/AndroidManifest.xml").read()
          try:
              t = ET.fromstring(raw); parsed = True
          except Exception as e:
              print("XML ERROR", e); t = None; parsed = False
          chk(parsed, "manifest well-formed XML")
          if parsed:
              ns = "{http://schemas.android.com/apk/res/android}"
              app = t.find("application")
              names = lambda tag: [e.get(ns + "name") for e in app.findall(tag)]
              acts, srv, prov = names("activity"), names("service"), names("provider")
              exp_a = [".Entry", ".helper.ProxyActivity"] + [f".helper.ProxyActivity$P{i}" for i in range(4)] \
                      + [f".helper.TransparentProxyActivity$P{i}" for i in range(4)] \
                      + [f".helper.ProxyPendingActivity$P{i}" for i in range(4)]
              exp_s = [".helper.DaemonService", ".helper.DaemonService$DaemonInnerService"] \
                      + [f".helper.ProxyService$P{i}" for i in range(4)] \
                      + [f".helper.ProxyJobService$P{i}" for i in range(4)] + [".helper.ProxyVpnService"]
              exp_p = [f".helper.ProxyContentProvider$P{i}" for i in range(4)] + [".helper.SystemCallProvider", ".helper.FileProvider"]
              chk(acts == exp_a and srv == exp_s and prov == exp_p, "manifest components exact (14 activities / 11 services / 6 providers)")
              chk(names("receiver") == [".helper.ProxyBroadcastReceiver"], "receiver exact")
              auth = sorted(e.get(ns + "authorities") for e in app.findall("provider"))
              chk(auth == sorted([f"com.aether.pc.P{i}" for i in range(4)] + ["com.aether.syscall", "com.aether.fp"]),
                  "provider authorities exact (acceptance URI content://com.aether.pc.P0)")
              comps = [(tag, e) for tag in ("activity", "service", "provider", "receiver") for e in app.findall(tag)]
              bad = [e.get(ns + "name") for _, e in comps
                     if e.get(ns + "exported") != "false" and e.get(ns + "name") != ".Entry"]
              chk(not bad, f"only Entry exported=true (violations: {bad})")
              vpn = [e for e in app.findall("service") if e.get(ns + "name") == ".helper.ProxyVpnService"][0]
              chk(vpn.get(ns + "permission") == "android.permission.BIND_VPN_SERVICE", "ProxyVpnService BIND_VPN_SERVICE")
              chk([e.get(ns + "name") for e in t.findall("uses-permission")] == ["android.permission.INTERNET"], "single INTERNET permission")
              job = [e for e in app.findall("service") if "ProxyJobService" in e.get(ns + "name")]
              chk(len(job) == 4 and all(e.get(ns + "permission") == "android.permission.BIND_JOB_SERVICE" for e in job),
                  "BIND_JOB_SERVICE on all 4 ProxyJobService entries")
              unresolved = []
              for _, e in comps:
                  n = e.get(ns + "name")
                  outer, _, nested = n.split(".")[-1].partition("$")
                  path = (f"{R}/app/src/main/kotlin/com/aether/{outer}.kt" if outer in ("App", "Entry")
                          else f"{R}/app/src/main/kotlin/com/aether/helper/{outer}.kt")
                  src = open(path).read() if os.path.exists(path) else ""
                  if not src or f"class {outer}" not in src or (nested and f"class {nested} :" not in src and f"class {nested}:" not in src):
                      unresolved.append(n)
              chk(not unresolved, f"every manifest component resolves to a class (unresolved: {unresolved})")

          # 4) P0..P3 are real nested classes (spec §2 rule)
          for f in ["ProxyActivity", "TransparentProxyActivity", "ProxyPendingActivity", "ProxyService", "ProxyJobService"]:
              s = open(f"{R}/app/src/main/kotlin/com/aether/helper/{f}.kt").read()
              chk(all(re.search(rf"class P{i} : {f}\(\)", s) for i in range(4)), f"{f}: real nested P0..P3")

          # 5) forbidden tokens (§15); whitelist only the mandated deliverable-8 README sentence
          pat = re.compile(r"snake|eightball|miniclip|\.mytext|\bmmap\b|\brwx\b|\bprctl\b|\bptrace\b", re.I)
          stray = []
          for dp, _, fs in os.walk(R):
              for fn in fs:
                  p = os.path.join(dp, fn)
                  for i, line in enumerate(open(p, encoding="utf-8", errors="ignore"), 1):
                      if pat.search(line) and not line.strip().startswith("Phase 1 = visible-mechanism mirror of"):
                          stray.append((p, i, line.strip()))
          chk(not stray, f"no forbidden tokens outside mandated README line (stray: {stray})")

          # 6) locked parameters (§1)
          ag = open(f"{R}/app/build.gradle.kts").read()
          rt = open(f"{R}/build.gradle.kts").read()
          chk('version "8.5.0"' in rt and 'version "1.9.24"' in rt, "locks: AGP 8.5.0 / Kotlin 1.9.24")
          chk("compileSdk = 35" in ag and "minSdk = 28" in ag and "targetSdk = 35" in ag, "locks: SDK 35/28/35")
          chk('abiFilters += "arm64-v8a"' in ag and ag.count("abiFilters") == 1, "locks: arm64-v8a only")
          chk("signingConfigs" not in ag, "locks: no signing config")
          chk('testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"' in ag
              and ag.count("androidTestImplementation(") == 3, "androidTest: runner + 3 deps configured")
          chk(open(f"{R}/gradle.properties").read() == "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n",
              "locks: gradle.properties exact")

          print("\nRESULT:", "ALL CHECKS PASSED" if not fail else f"{len(fail)} FAILURES: {fail}")
          sys.exit(1 if fail else 0)
          PYEOF

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download debug APK from Build job
        uses: actions/download-artifact@v4
        with:
          name: aether-engine-debug-${{ github.sha }}
          path: /tmp/aether-apk

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/aether-release-notes.md <<'NOTES'
          Aether Engine Phase 1 build published from this tag.

          **Artifacts**
          - `aether-engine-debug.apk` - debug build of `com.aether` (arm64-v8a only, contains `libaether.so`).
          - `SHA256SUMS.txt` - SHA-256 checksum of the APK.

          **Scope**
          - Phase 1 = visible-mechanism mirror; hidden payload intentionally omitted.
          - 11-entry `RegisterNatives` JNI contract; component families are empty shells with logcat tags.
          - Debug artifact only - **no release signing config exists in this repository**; not a trusted distribution build.
          - No networking endpoint is referenced in the Phase 1 tree; device acceptance step 10 asserts `NO-NET-OK`.
          NOTES

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find /tmp/aether-apk -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error title=APK artifact not found::"
            exit 1
          fi
          cp "$APK" aether-engine-debug.apk
          sha256sum aether-engine-debug.apk > SHA256SUMS.txt
          assets=(aether-engine-debug.apk SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Aether Engine Phase 1 $GITHUB_REF_NAME" \
              --notes-file /tmp/aether-release-notes.md \
              "${assets[@]}"
          fi
