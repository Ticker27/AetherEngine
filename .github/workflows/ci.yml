name: AetherEngine CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aether-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Host Container Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify source, manifest, and JNI structure
        run: python3 scripts/verify_host_structure.py

      - name: Verify JNI bootstrap and runtime source
        shell: bash
        run: |
          set -euo pipefail
          rg -q 'System\.loadLibrary\("aether"\)' android-host/src/main/kotlin/com/aether/host/bridge/Native.kt
          rg -q 'JNI_OnLoad' aether-native/src/main/cpp/jni/jni_onload.cpp
          rg -q 'extern "C" JNIEXPORT jint JNICALL JNI_OnLoad' aether-native/src/main/cpp/jni/jni_onload.cpp
          rg -q 'RegisterNativeMethods' aether-native/src/main/cpp/jni/native_registry.cpp
          rg -q 'com/aether/host/bridge/Native' aether-native/src/main/cpp/jni/native_registry.cpp
          rg -q 'sizeof\(kMethods\)' aether-native/src/main/cpp/jni/native_registry.cpp

  android:
    name: Android Signed Release Build & Tests
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Resolve Flutter module dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Configure Flutter SDK path for Gradle
        shell: bash
        run: |
          set -euo pipefail
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" >> local.properties

      - name: Set up Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Prepare build scripts
        run: |
          chmod +x ./gradlew
          chmod +x scripts/prepare_release_keystore.sh scripts/sign_release_apk.sh scripts/verify_apk_signature.py

      - name: Assemble host release APK
        run: ./gradlew :android-host:assembleRelease --stacktrace --console=plain

      - name: Materialize production release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: ./scripts/prepare_release_keystore.sh android-host/build/signing/release.p12

      - name: Sign release APK with v1 and v2
        env:
          ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./scripts/sign_release_apk.sh
          android-host/build/outputs/apk/release/android-host-release-unsigned.apk
          android-host/build/outputs/apk/release/aether-engine-release.apk
          android-host/build/signing/release.p12

      - name: Remove unsigned release intermediate
        run: rm -f android-host/build/outputs/apk/release/android-host-release-unsigned.apk

      - name: Run Android host unit tests
        run: ./gradlew :android-host:test --stacktrace

      - name: Verify signed release APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: ./scripts/verify_apk_signature.py android-host/build/outputs/apk/release/aether-engine-release.apk

      - name: Verify release architecture
        run: python3 scripts/verify_apk_architecture.py android-host/build/outputs/apk/release/aether-engine-release.apk release

      - name: Run native test suite (host-side)
        run: sh scripts/native_tests.sh

      - name: Upload signed release APK only
        uses: actions/upload-artifact@v4
        with:
          name: aether-engine-release-${{ github.sha }}
          path: android-host/build/outputs/apk/release/aether-engine-release.apk
          if-no-files-found: error
          retention-days: 14

  flutter:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze Flutter source
        working-directory: flutter-app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: flutter-app
        run: flutter test

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - structure
      - android
      - flutter
    steps:
      - name: CI passed
        run: echo "AetherEngine release-only CI passed; one signed v1/v2 APK was assembled and uploaded."
