name: AetherEngine CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aether-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Host Container Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify source, manifest, and JNI structure
        run: python3 scripts/verify_host_structure.py

      - name: Verify JNI bootstrap and runtime source
        shell: bash
        run: |
          set -euo pipefail
          rg -q 'System\.loadLibrary\("aether"\)' android-host/src/main/kotlin/com/aether/host/bridge/Native.kt
          rg -q 'JNI_OnLoad' aether-native/src/main/cpp/jni/jni_onload.cpp
          rg -q 'extern "C" JNIEXPORT jint JNICALL JNI_OnLoad' aether-native/src/main/cpp/jni/jni_onload.cpp
          rg -q 'RegisterNativeMethods' aether-native/src/main/cpp/jni/native_registry.cpp
          rg -q 'com/aether/host/bridge/Native' aether-native/src/main/cpp/jni/native_registry.cpp
          rg -q 'sizeof\(kMethods\)' aether-native/src/main/cpp/jni/native_registry.cpp

  android:
    name: Android Build, Unit Tests & APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Resolve Flutter module dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Configure Flutter SDK path for Gradle
        shell: bash
        run: |
          set -euo pipefail
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" >> local.properties

      - name: Set up Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :android-host:assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/assemble-debug.log || {
            tail -n 60 /tmp/assemble-debug.log
            diagnostics="$(grep -E '(^e:|error:|^\* What went wrong:|^Execution failed)' /tmp/assemble-debug.log | tail -n 40 || true)"
            if [[ -z "$diagnostics" ]]; then diagnostics="$(tail -n 20 /tmp/assemble-debug.log)"; fi
            summary="$(printf '%s' "$diagnostics" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Gradle assembleDebug failed::$summary"
            exit 1
          }

      - name: Assemble release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :android-host:assembleRelease --stacktrace --console=plain 2>&1 | tee /tmp/assemble-release.log || {
            tail -n 60 /tmp/assemble-release.log
            diagnostics="$(grep -E '(^e:|error:|^\* What went wrong:|^Execution failed)' /tmp/assemble-release.log | tail -n 40 || true)"
            if [[ -z "$diagnostics" ]]; then diagnostics="$(tail -n 20 /tmp/assemble-release.log)"; fi
            summary="$(printf '%s' "$diagnostics" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Gradle assembleRelease failed::$summary"
            exit 1
          }

      - name: Run Android host unit tests
        run: ./gradlew :android-host:test --stacktrace

      - name: Verify Android, custom-native, Flutter, and Dart binaries
        run: |
          python3 scripts/verify_apk_architecture.py android-host/build/outputs/apk/debug/android-host-debug.apk debug
          python3 scripts/verify_apk_architecture.py android-host/build/outputs/apk/release/android-host-release-unsigned.apk release

      - name: Run native runtime-state tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -I aether-native/src/main/cpp \
            aether-native/src/main/cpp/runtime/runtime_state.cpp \
            integration-test/native/runtime_state_test.cpp \
            -o /tmp/runtime_state_test -pthread
          /tmp/runtime_state_test

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-host-apks-${{ github.sha }}
          path: |
            android-host/build/outputs/apk/debug/android-host-debug.apk
            android-host/build/outputs/apk/release/android-host-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  flutter:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze Flutter source
        working-directory: flutter-app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: flutter-app
        run: flutter test

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - structure
      - android
      - flutter
    steps:
      - name: CI passed
        run: echo "AetherEngine host-container CI passed; Android APKs were assembled and uploaded."
