name: AetherEngine CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aether-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Host Container Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source, manifest, and JNI structure
        run: python3 scripts/verify_host_structure.py

      - name: Verify JNI bootstrap and runtime source
        shell: bash
        run: |
          set -euo pipefail
          rg -q 'System\.loadLibrary\("aether"\)' android-host/src/main/kotlin/com/aether/host/bridge/Native.kt
          rg -q 'JNI_OnLoad' aether-native/src/main/cpp/jni/jni_onload.cpp
          rg -q 'extern "C" JNIEXPORT jint JNICALL JNI_OnLoad' aether-native/src/main/cpp/jni/jni_onload.cpp
          rg -q 'RegisterNativeMethods' aether-native/src/main/cpp/jni/native_registry.cpp
          rg -q 'com/aether/host/bridge/Native' aether-native/src/main/cpp/jni/native_registry.cpp
          rg -q 'sizeof\(kMethods\)' aether-native/src/main/cpp/jni/native_registry.cpp

  android:
    name: Android Build, Unit Tests & APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --install "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew :android-host:assembleDebug --stacktrace

      - name: Assemble release APK
        run: ./gradlew :android-host:assembleRelease --stacktrace

      - name: Run Android host unit tests
        run: ./gradlew :android-host:test --stacktrace

      - name: Verify custom native library is packaged
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK=android-host/build/outputs/apk/debug/android-host-debug.apk
          RELEASE_APK=android-host/build/outputs/apk/release/android-host-release-unsigned.apk
          unzip -Z1 "$DEBUG_APK" > /tmp/debug-apk-files.txt
          unzip -Z1 "$RELEASE_APK" > /tmp/release-apk-files.txt
          grep -Fxq 'lib/arm64-v8a/libaether.so' /tmp/debug-apk-files.txt
          grep -Fxq 'lib/arm64-v8a/libaether.so' /tmp/release-apk-files.txt

      - name: Run native runtime-state tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -I aether-native/src/main/cpp \
            aether-native/src/main/cpp/runtime/runtime_state.cpp \
            integration-test/native/runtime_state_test.cpp \
            -o /tmp/runtime_state_test -pthread
          /tmp/runtime_state_test

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-host-apks-${{ github.sha }}
          path: |
            android-host/build/outputs/apk/debug/android-host-debug.apk
            android-host/build/outputs/apk/release/android-host-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  flutter:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze Flutter source
        working-directory: flutter-app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: flutter-app
        run: flutter test

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - structure
      - android
      - flutter
    steps:
      - name: CI passed
        run: echo "AetherEngine host-container CI passed; Android APKs were assembled and uploaded."
