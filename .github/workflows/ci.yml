name: AetherEngine CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aether-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------------------------------------
  # Repository validation
  # ------------------------------------------------------------

  structure:
    name: Repository Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository structure
        shell: bash
        run: |
          set -e

          test -d .github/workflows
          test -d android-host

          test -f android-host/build.gradle.kts
          test -f android-host/src/main/AndroidManifest.xml
          test -f android-host/src/main/kotlin/com/aether/host/AetherApplication.kt
          test -f android-host/src/main/kotlin/com/aether/host/MainActivity.kt

          # Checkpoint 2: Native.kt (declaration) ได้รับอนุญาต แต่ต้องเป็น declaration เท่านั้น
          test -f android-host/src/main/kotlin/com/aether/host/Native.kt
          ! rg -q 'System\.loadLibrary|loadLibrary\(' android-host/src/main/kotlin/com/aether/host/Native.kt

          # ยังห้ามมี native/flutter implementation
          ! test -e aether-native
          ! test -e flutter-app
          ! test -e android-host/src/main/cpp
          ! test -f android-host/src/main/kotlin/com/aether/host/AetherFlutterHost.kt
          ! test -f android-host/src/test/kotlin/com/aether/host/NativeContractTest.kt

          echo "Repository structure OK (Checkpoint 2 scope)."

  # ------------------------------------------------------------
  # Android / Kotlin
  # ------------------------------------------------------------

  android:
    name: Android Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build (assembleDebug)
        run: ./gradlew :android-host:assembleDebug --stacktrace

      - name: Test
        run: ./gradlew :android-host:test --stacktrace

  # ------------------------------------------------------------
  # Final gate
  # ------------------------------------------------------------

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest

    needs:
      - structure
      - android

    steps:
      - name: CI passed
        run: echo "AetherEngine CI PASSED (Checkpoint 2)"
