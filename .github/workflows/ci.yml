name: Blutter Toolchain Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tool:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned tool in Alpine ARM64 container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm -v "$PWD:/work" -w /work alpine:3.21 sh -ec '
            apk add --no-cache python3 py3-requests py3-elftools git cmake ninja build-base pkgconf icu-dev capstone-dev
            python3 tools/build_blutter_toolchain.py
          ' 2>&1 | tee toolchain-build.log
      - name: Upload tool and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: blutter-dart354-alpine-arm64
          path: out/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blutter-toolchain-build-log
          path: toolchain-build.log
          if-no-files-found: warn
          retention-days: 7
