name: build

# AetherEngine — Flutter host + native engine
# ประกอบแบบเป็นเฟส: ทุก push ต้องเขียวก่อนเติมส่วนถัดไป
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (gate)
        run: flutter analyze --no-pub

      - name: Build debug APK (arm64-v8a)
        run: flutter build apk --debug --target-platform android-arm64 --no-pub

      - name: Smoke — verify engine .so + flutter assets in APK
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/(libaether|libflutter)\.so|classes[0-9]*\.dex|assets/flutter_assets'
          du -h "$APK"

      - name: Smoke — verify proxy components in merged manifest
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          echo "aapt2=$AAPT"
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/manifest.txt
          fail=0
          for c in 'ProxyActivity$P0' 'ProxyActivity$P3L' 'ProxyService$P2' 'ProxyContentProvider$P1' 'ProxyJobService$P3' 'ProxyVpnService' 'SystemCallProvider' 'com.aether.Entry' 'InternalWebBrowser' 'AetherFileProvider' ; do
            if grep -q "$c" /tmp/manifest.txt; then echo "OK   $c"; else echo "MISS $c"; fail=1; fi
          done
          echo "--- process tags ---"
          grep -oE '":p[0-3]"|":helper"' /tmp/manifest.txt | sort | uniq -c
          exit $fail

      - name: Smoke — verify native method table in libaether.so
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          rm -rf /tmp/so && mkdir -p /tmp/so
          unzip -o -q "$APK" 'lib/arm64-v8a/libaether.so' -d /tmp/so
          fail=0
          for m in chl djp ac awl i eio aior ic ilil pjowqpxe; do
            if strings /tmp/so/lib/arm64-v8a/libaether.so | grep -qx "$m"; then echo "OK   $m"; else echo "MISS $m"; fail=1; fi
          done
          exit $fail

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherEngine-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
