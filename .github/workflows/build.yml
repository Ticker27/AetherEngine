name: build

# AetherEngine — Flutter host + native engine
# ประกอบแบบเป็นเฟส: ทุก push ต้องเขียวก่อนเติมส่วนถัดไป
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (gate)
        run: flutter analyze --no-pub

      - name: Build debug APK (arm64-v8a)
        run: flutter build apk --debug --target-platform android-arm64 --no-pub

      - name: Smoke — verify engine .so + flutter assets in APK
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/(libaether|libflutter)\.so|classes[0-9]*\.dex|assets/flutter_assets'
          du -h "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherEngine-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
