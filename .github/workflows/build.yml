name: build

# AetherEngine — Flutter host + native engine
# ประกอบแบบเป็นเฟส: ทุก push ต้องเขียวก่อนเติมส่วนถัดไป
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (gate)
        run: flutter analyze --no-pub

      - name: Build release APK (arm64-v8a, AOT — no debug engine/VkLayer bloat)
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Smoke — verify engine .so + flutter assets in APK
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/(libaether|libflutter|libapp)\.so|classes[0-9]*\.dex|assets/flutter_assets'
          du -h "$APK"

      - name: Smoke — verify proxy components in merged manifest
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          echo "aapt2=$AAPT"
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/manifest.txt
          fail=0
          for c in 'ProxyActivity$P0' 'ProxyActivity$P3L' 'ProxyService$P2' 'ProxyContentProvider$P1' 'ProxyJobService$P3' 'ProxyVpnService' 'SystemCallProvider' 'com.aether.Entry' 'InternalWebBrowser' 'AetherFileProvider' ; do
            if grep -q "$c" /tmp/manifest.txt; then echo "OK   $c"; else echo "MISS $c"; fail=1; fi
          done
          echo "--- process tags ---"
          grep -oE '":p[0-3]"|":helper"' /tmp/manifest.txt | sort | uniq -c
          exit $fail

      - name: Smoke — verify native method table in libaether.so
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          rm -rf /tmp/so && mkdir -p /tmp/so
          unzip -o -q "$APK" 'lib/arm64-v8a/libaether.so' -d /tmp/so
          python3 - <<'PY'
          import sys
          data = open('/tmp/so/lib/arm64-v8a/libaether.so', 'rb').read()
          fail = 0
          for m in ['chl', 'djp', 'ac', 'awl', 'i', 'eio', 'aior', 'ic', 'ilil', 'pjowqpxe']:
              if b'\x00' + m.encode() + b'\x00' in data:
                  print('OK  ', m)
              else:
                  print('MISS', m)
                  fail = 1
          sys.exit(fail)
          PY

      - name: Smoke — verify 3 native libs + 16KB page alignment
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          rm -rf /tmp/so && mkdir -p /tmp/so
          unzip -o -q "$APK" 'lib/arm64-v8a/libaether.so' 'lib/arm64-v8a/libflutter.so' 'lib/arm64-v8a/libapp.so' -d /tmp/so
          python3 - <<'PY'
          import struct, sys
          def loads_align(path):
              d = open(path, 'rb').read()
              e_phoff = struct.unpack('<Q', d[32:40])[0]
              e_phentsize = struct.unpack('<H', d[54:56])[0]
              e_phnum = struct.unpack('<H', d[56:58])[0]
              al = []
              for i in range(e_phnum):
                  o = e_phoff + i * e_phentsize
                  if struct.unpack('<I', d[o:o+4])[0] == 1:
                      al.append(struct.unpack('<Q', d[o+48:o+56])[0])
              return al
          fail = 0
          for name in ('libaether.so', 'libflutter.so', 'libapp.so'):
              al = loads_align('/tmp/so/lib/arm64-v8a/' + name)
              ok = all(a >= 0x4000 for a in al)
              print(('OK  ' if ok else 'FAIL'), name, [hex(a) for a in al])
              if not ok:
                  fail = 1
          sys.exit(fail)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherEngine-apk
          path: build/app/outputs/flutter-apk/*.apk
