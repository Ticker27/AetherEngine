name: build

# AetherEngine — assemble APK ผ่าน GitHub Actions เท่านั้น
# (โครงงานไม่มี gradle wrapper เก็บใน binary — CI ติดตั้ง Gradle 8.7 ตรง)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (accept licenses)
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK (arm64-v8a)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Smoke — verify engine .so in APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libaether.so|classes.dex'
          ls -la "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherEngine-debug-apk
          path: app/build/outputs/apk/debug/*.apk
